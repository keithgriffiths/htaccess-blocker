# htaccess-blocker v2.0 | Optional Apache 2.4 rewrite rules
# Add ABOVE the WordPress-managed # BEGIN WordPress block.
# These patterns target a small selection of legacy scraping tools.
# They are NOT a substitute for a WAF, authentication or rate limiting.
# SetEnvIf/legacy Apache 2.2 access directives are deliberately omitted.
<IfModule mod_rewrite.c>
    RewriteEngine On
    # Match full product identifiers rather than generic words like "crawl".
    RewriteCond %{HTTP_USER_AGENT} "(WebBandit|EmailSiphon|EmailWolf)" [NC]
    RewriteRule ^ - [F,L]
</IfModule>
