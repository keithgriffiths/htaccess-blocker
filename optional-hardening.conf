# htaccess-blocker v2.0 | OPTIONAL hardening rules
# Review before enabling. Apache modules and AllowOverride settings vary.
# Prevent directory indexes if your server permits the Options directive.
# Options -Indexes

# Prevent HTTP access to typical local secrets. Test any named files you use.
<IfModule mod_authz_core.c>
    <FilesMatch "^(\.env(?:\..*)?|\.git|composer\.(?:json|lock)|wp-config\.php)$">
        Require all denied
    </FilesMatch>
</IfModule>
